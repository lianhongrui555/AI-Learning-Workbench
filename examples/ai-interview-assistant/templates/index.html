<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 面试知识库助手</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; max-width: 860px; margin: 40px auto; padding: 16px; }
    textarea { width: 100%; height: 100px; padding: 10px; }
    button { margin-top: 10px; padding: 10px 18px; }
    pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>AI 面试知识库助手</h1>
  <textarea id="question" placeholder="输入面试问题"></textarea>
  <button id="ask">提问</button>
  <div id="result"></div>
  <script>
    document.getElementById("ask").addEventListener("click", async () => {
      const question = document.getElementById("question").value.trim();
      if (!question) return;
      const result = document.getElementById("result");
      result.textContent = "正在思考……";
      const response = await fetch("/ask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({question})
      });
      const data = await response.json();
      result.innerHTML = `<p>${data.answer}</p><pre>${(data.sources || []).join("\\n")}</pre>`;
    });
  </script>
</body>
</html>
